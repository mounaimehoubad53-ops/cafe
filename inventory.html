<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المخزون</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">

        <h2>☕ المقهى</h2>

        <nav>
            <a href="index.html">🏠 الرئيسية</a>
            <a href="sales.html">💰 المبيعات</a>
            <a href="inventory.html" class="active">📦 المخزون</a>
            <a href="invoices.html">🧾 الفواتير</a>
            <a href="purchases.html">🛒 المشتريات</a>
            <a href="reports.html">📊 التقارير</a>
        </nav>

    </aside>


    <main class="main">

        <header>
            <h1>📦 المخزون</h1>
            <p>إدارة منتجات ومواد المقهى</p>
        </header>


        <!-- إضافة منتج -->

        <section class="table-section">

            <h2>➕ إضافة منتج</h2>

            <form id="inventoryForm">

                <label>اسم المنتج</label>

                <input
                    type="text"
                    id="productName"
                    placeholder="مثال: قهوة"
                    required
                >


                <label>الكمية</label>

                <input
                    type="number"
                    id="productQuantity"
                    min="0"
                    placeholder="مثال: 10"
                    required
                >


                <label>الوحدة</label>

                <select id="productUnit">

                    <option value="قطعة">قطعة</option>
                    <option value="كغ">كغ</option>
                    <option value="غرام">غرام</option>
                    <option value="لتر">لتر</option>
                    <option value="علبة">علبة</option>

                </select>


                <label>سعر البيع (DA)</label>

                <input
                    type="number"
                    id="productPrice"
                    min="0"
                    placeholder="مثال: 150"
                    required
                >


                <label>الحد الأدنى للمخزون</label>

                <input
                    type="number"
                    id="minimumStock"
                    min="0"
                    placeholder="مثال: 5"
                    required
                >


                <button type="submit">
                    إضافة المنتج
                </button>

            </form>

        </section>


        <!-- إحصائيات -->

        <section class="cards">

            <div class="card">

                <div class="icon">📦</div>

                <div>

                    <h3>عدد المنتجات</h3>

                    <strong id="productCount">
                        0
                    </strong>

                </div>

            </div>


            <div class="card">

                <div class="icon">⚠️</div>

                <div>

                    <h3>مخزون منخفض</h3>

                    <strong id="lowStock">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- جدول المخزون -->

        <section class="table-section">

            <h2>📋 المنتجات</h2>

            <table>

                <thead>

                    <tr>

                        <th>المنتج</th>
                        <th>الكمية</th>
                        <th>الوحدة</th>
                        <th>السعر</th>
                        <th>الحالة</th>
                        <th>حذف</th>

                    </tr>

                </thead>

                <tbody id="inventoryTable">

                </tbody>

            </table>

        </section>

    </main>


    <script src="inventory.js"></script>

</body>

</html>
