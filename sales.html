<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المبيعات</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">

        <h2>☕ المقهى</h2>

        <nav>
            <a href="index.html">🏠 الرئيسية</a>
            <a href="sales.html" class="active">💰 المبيعات</a>
            <a href="inventory.html">📦 المخزون</a>
            <a href="#">🧾 الفواتير</a>
            <a href="#">🛒 المشتريات</a>
            <a href="#">📊 التقارير</a>
        </nav>

    </aside>


    <!-- المحتوى الرئيسي -->
    <main class="main">

        <header>
            <h1>💰 المبيعات اليومية</h1>
            <p>اختر المنتجات لإضافتها إلى الطلب</p>
        </header>


        <div class="pos-container">


            <!-- المنتجات -->

            <section class="products-section">

                <h2>☕ المنتجات</h2>

                <div id="productsGrid" class="products-grid">

                    <!-- المنتجات ستظهر هنا تلقائيًا -->

                </div>

            </section>


            <!-- الطلب -->

            <section class="order-section">

                <h2>🧾 الطلب الحالي</h2>

                <div id="orderItems">

                    <p class="empty-order">
                        لم تتم إضافة أي منتجات
                    </p>

                </div>


                <div class="order-total">

                    <span>الإجمالي</span>

                    <strong id="orderTotal">
                        0 DA
                    </strong>

                </div>


                <button
                    id="completeSale"
                    class="complete-sale"
                >
                    💳 تسجيل البيع
                </button>

            </section>

        </div>

    </main>


    <script src="sales.js"></script>

</body>

</html>
